{% for column in columns %}
<section class="kanban-column" data-stage-id="{{ column.stage.id }}">
    <header class="kanban-column-head">
        <div class="kanban-stage-title"><i style="background:{{ column.stage.color }}"></i><div><strong>{{ column.stage.name }}</strong><span><b data-stage-count>{{ column.count }}</b> oportunidade(s)</span></div></div>
        <strong class="kanban-column-value" data-stage-total>{{ column.total_label }}</strong>
    </header>
    <div class="kanban-dropzone" data-dropzone data-windowed="{{ 1 if column.windowed else 0 }}" data-window-offset="{{ column.offset or 0 }}" data-window-count="{{ column.count }}" data-stage-id="{{ column.stage.id }}" tabindex="0" role="region" aria-label="Cards da etapa {{ column.stage.name }}">
        {% if column.windowed %}<div data-window-spacer="top" aria-hidden="true"></div>{% endif %}
        {% include "tickets/_kanban_cards.html" %}
        {% if column.windowed %}<div data-window-spacer="bottom" aria-hidden="true"></div>{% endif %}
    </div>
</section>
{% endfor %}
